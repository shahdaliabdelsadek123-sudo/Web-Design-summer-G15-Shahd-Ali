<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <section class="contact-section">

        <div class="container">

            <div class="left-section">

                <h1 class="h1-left">Let's Chat</h1>

                <p>
                    Whether you have a question, want to
                    start a project or simply want to connect.
                </p>

                <p>
                    Feel free to send me a message in the
                    contact form.
                </p>

            </div><div class="right-section">

                <h2 class="h2-right">Contact</h2>

                <p class="required">*Required</p>

                <form>

                    <div class="form-div">
                        <label>Name *</label>
                        <input type="text">
                    </div>

                    <div class="form-div">
                        <label>Email *</label>
                        <input type="email">
                    </div>

                    <div class="form-div">
                        <label>Company</label>
                        <input type="text">
                    </div>

                    <div class="form-div">
                        <label>Phone</label>
                        <input type="text">
                    </div>

                    <div class="form-div">
                        <label>Message *</label>
                        <textarea></textarea>
                    </div>

                    <button type="submit">SUBMIT</button>

                </form>

            </div>

        </div>

    </section>

</body>

</html>
