<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Table Exam</title>
</head>

<body>

<table border="1" align="center">

    <tr>
        <th rowspan="3">Day</th>
        <th colspan="3">Seminar</th>
    </tr>

    <tr>

        <th rowspan="2">Topic</th>
    </tr>
    <tr>
        <th>Begin</th>===
        <th>End</th>
    </tr>
    <tr>
        <td rowspan="2">Monday</td>

        <td>Introduction to XML</td>
    </tr>
    <tr>
        <td>Validity: DTD and Relax NG</td>
    </tr>
    <tr>
        <td rowspan="3">Tuesday</td>

        <td bgcolor="lightgreen">11:00 a.m.</td>
        <td>XPath</td>
    </tr>
    <tr>
        <td bgcolor="lightpurple">11:00 a.m.</td>
        <td bgcolor="lightyellow">2:00 p.m.</td>
        <td rowspan="2">XSL Transformations</td>
    </tr>
    <tr>
        <td bgcolor="lightpink">2:00 p.m.</td>
        <td bgcolor="lightgray">5:00 p.m.</td>
    </tr>
    <tr>
        <td>Wednesday</td>
        <td bgcolor="lightbink">8:00 a.m.</td>
        <td bgcolor="lightred">12:00 p.m.</td>
        <td>XSL Formatting Objects</td>
    </tr>

</table>

</html>
